  <rect width="32" height="32" rx="8" fill="#c1121f"/>
  <path d="M7.5 8a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3v19l-2.83-2-2.83 2-2.84-2-2.83 2-2.83-2L7.5 27z" fill="#ffffff"/>
  <path d="m11.9 15.7 2.8 2.8 5.4-5.9" fill="none" stroke="#c1121f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
