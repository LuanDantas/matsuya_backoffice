<!--
  A mesma marca de `@matsuya/ui/Marca`, com as cores literais.

  Duplicada de propósito: o favicon é lido pelo navegador antes de qualquer
  JavaScript ou CSS existir, então não pode depender de `currentColor` nem de
  variável de tema. Se a marca mudar, os dois arquivos mudam juntos.
-->
